  <article class="task" data-task-id="{{TASK_ID}}" data-task-status="pending">
    <header class="task-header">
      <h3><span class="badge">{{TASK_ID}}</span><span class="task-name">{{TASK_NAME}}</span></h3>
      <span class="right"><span class="task-progress">0 / 0</span><span class="chevron">▾</span></span>
    </header>
    <div class="task-body">
      <div class="task-grid{{HAS_NOTES_CLASS}}">
        <div class="task-main">
          <div class="files">
            <span class="label">Files</span>{{FILES_HTML}}
          </div>
          <ol class="steps">
{{STEPS}}
          </ol>
        </div>
{{NOTES_BLOCK}}
      </div>
{{COMPARE_BLOCK}}
    </div>
  </article>
